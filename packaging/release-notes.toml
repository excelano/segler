# What this release tells the stores it changed, in every language the
# listing is in. One file, both languages, because a translation is reviewed
# beside its source.
#
# The version is checked against the release being cut: notes left from last
# time stop the release rather than reaching a listing. A language the listing
# has and this file does not is also a refusal - a German listing saying
# something nobody wrote is worse than a release that stops.
#
# Nothing else reads this. The GitHub release, the Debian changelog and the
# AppStream entry take commit subjects.

version = "0.3.0"

[locales."de-de"]
whats-new = """
Segler zeigt eine Transkriptspur (track) jetzt so, wie ein Untertitel-Editor \
sie zeigt: eine Zeitspalte neben dem Text, jeder Sprecher vor seinem Beitrag, \
Kapiteltitel als Überschriften und Vorschaubilder für Titelbild und \
Einzelbilder. Der Text eines Beitrags, ein Sprechername und ein Kapiteltitel \
lassen sich direkt bearbeiten, ebenso Anfangs- und Endzeit eines Abschnitts. \
Enthält ein Archiv Audio- oder Videoaufnahmen einer Spur, listet Segler sie \
auf und prüft, dass jede zu einer Spur des Dokuments gehört. Trägt ein Archiv \
das Originaldokument, aus dem es entstanden ist, prüft Segler, dass dessen Typ \
angegeben ist, und zeigt ihn an. Beim Bearbeiten bleibt der Leerraum erhalten: \
Was Sie eingeben, wird so gespeichert, dass es genauso wieder gelesen wird.
"""

[locales."en-us"]
whats-new = """
Segler now shows a transcript track the way a subtitle editor does: a time \
column beside the text, each speaker before their turn, chapter titles as \
headings, and thumbnails for the cover and frames. A turn's text, a speaker's \
name and a chapter title are edited in place, and so are a cue's start and \
end times. When an archive carries audio or video recordings of a track, \
Segler lists them and checks that each belongs to a track the document has. \
When an archive carries the original document it was made from, Segler checks \
that its type is declared and shows it. Editing keeps whitespace as typed: \
what you enter is saved so that it reads back the same.
"""
