# What this release tells the stores it changed, in every language the
# listing is in. One file, both languages, because a translation is reviewed
# beside its source.
#
# The version is checked against the release being cut: notes left from last
# time stop the release rather than reaching a listing. A language the listing
# has and this file does not is also a refusal - a German listing saying
# something nobody wrote is worse than a release that stops.
#
# Nothing else reads this. The GitHub release, the Debian changelog and the
# AppStream entry take commit subjects.

version = "0.4.0"

[locales."de-de"]
whats-new = """
Segler unterstützt jetzt DocLang 0.10 und prüft Archive nach dessen \
Paketregeln: Jeder Teil hat einen Inhaltstyp, die Beziehungen des Archivs \
nennen sein Dokument und sein Originaldokument, jede Datei, auf die das \
Dokument verweist, liegt im Archiv, und eine Datei, auf die nichts verweist, \
wird als Warnung gemeldet. Dokumente, die DocLang 0.9 angeben, öffnen ohne \
Versionswarnung, denn die Regeln von 0.9 sind dieselben wie die von 0.10. Die \
Pakete enthalten jetzt die Lizenzen des fremden Codes, aus dem Segler gebaut \
ist.
"""

[locales."en-us"]
whats-new = """
Segler now supports DocLang 0.10 and checks archives against its packaging \
rules: every part has a content type, the archive's relationships name its \
document and its original source, every file the document refers to is in \
the archive, and a file nothing refers to is reported as a warning. Documents \
that declare DocLang 0.9 open without a version warning, because the 0.9 \
rules are the same as 0.10's. The packages now include the licenses of the \
third-party code Segler is built from.
"""
