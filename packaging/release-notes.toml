# What this release tells the stores it changed, in every language the
# listing is in. One file, both languages, because a translation is reviewed
# beside its source.
#
# The version is checked against the release being cut: notes left from last
# time stop the release rather than reaching a listing. A language the listing
# has and this file does not is also a refusal - a German listing saying
# something nobody wrote is worse than a release that stops.
#
# Nothing else reads this. The GitHub release, the Debian changelog and the
# AppStream entry take commit subjects.

version = "0.2.0"

[locales."de-de"]
whats-new = """
Segler folgt jetzt DocLang 0.9. Es prüft Medientranskripte mit Zeitmarken \
(track), mehrere Beschriftungen an einem Element und die übrigen Neuerungen \
von 0.8 und 0.9, und es liest Leerraum so, wie 0.9 ihn festlegt. Ein \
Dokument, das eine ältere Version angibt, etwa DocLang 0.7 aus Duckling oder \
Docling, wird als 0.9 geprüft und bleibt gültig, mit einem Hinweis darauf. \
Alle Beschriftungen eines Bildes oder einer Tabelle werden jetzt angezeigt, \
und ein Leerzeichen am Rand von fettem oder kursivem Text geht in der Ansicht \
nicht mehr verloren.
"""

[locales."en-us"]
whats-new = """
Segler now follows DocLang 0.9. It validates time-aligned media transcripts \
(track), several captions on one element and the rest of what 0.8 and 0.9 \
added, and it reads whitespace the way 0.9 defines it. A document that \
declares an older version, such as DocLang 0.7 from Duckling or Docling, is \
checked as 0.9 and stays valid, with a note saying so. Every caption of a \
picture or table is now shown, and a space at the edge of bold or italic text \
is no longer lost from the view.
"""
