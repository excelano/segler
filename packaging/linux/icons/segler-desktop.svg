<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <clipPath id="rounded"><rect width="64" height="64" rx="14.317"/></clipPath>
  <g clip-path="url(#rounded)">
  <!--
    Segler: a sailboat on a blue square. Mainsail, jib, hull.

    Author: David M. Anderson
    Built with AI assistance (Claude, Anthropic)

    The name is German for sailor, so the mark is a boat. It is not DocLang's
    logo, which is a stylised document and belongs to that project; this is
    the application's own mark and the two are meant to read as different
    things.

    Chosen by David on 2026-09-04 from a sheet of five: a fine compass rose,
    a bold compass, an anchor, a figure-eight knot, and this. The fine rose
    and the knot turned to mud at 16 pixels; the anchor read best there and
    was the most generic thing on the sheet at 128; the compass would have
    meant redrawing the document icons. The first icon in this file was a
    stroked boat on a wave, which David asked to replace the same evening.

    This comment sits inside the element rather than above it, and that is a
    measurement rather than a style: gdk-pixbuf sniffs the first 256 bytes for
    `<svg` and refuses the file when the tag comes later, which is what a
    header comment above the tag does. slipcase-desktop found it the hard way.
    Keep the opening tag on the second line.

    Filled shapes and no strokes at all, which is what still reads at 16
    pixels. The palette is slipcase-desktop's, on purpose: the two Excelano
    desktop applications should look like siblings on a launcher. Read: a
    cream mainsail and a slightly greyer jib on a blue tile, a dark hull.
    Checked at 16, 24, 32, 48 and 128 pixels on light and dark grounds.

    A plain square, full bleed and unframed: a store takes a square and
    applies its own corner rounding, so a drawing that carries its own
    smaller shape or its own outline into that frame is a sticker on a
    tile. The blue reaches all four edges and nothing is drawn around it.
  -->
  <rect width="64" height="64" fill="#4a6fa5"/>
  <!-- The mainsail, its leech bowing out to the right. -->
  <path d="M31 9 L31 42 L51 42 Q45 24 31 9 z" fill="#f2eee4"/>
  <!-- The jib, forward of the mast and a shade darker so the two tell apart. -->
  <path d="M27 19 L27 42 L14 42 Q16 30 27 19 z" fill="#d9d3c3"/>
  <!-- The hull. -->
  <path d="M11 46 h42 l-5 7 h-32 z" fill="#2f3337"/>
</g>
</svg>
