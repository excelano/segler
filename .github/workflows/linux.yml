# Build the Linux packages and put them under the checks a machine can run:
# the package's ownership and modes, its md5sums, lintian, the media-type
# association through GLib, and that the thing installs and runs. The suite,
# clippy and formatting are the fleet's `ci.yml` and are not repeated here.
#
# On a push this is a check. On a published release it is also where the
# packages come from: both architectures are built here and attached to the
# release, rather than one being built by hand on whichever machine happened
# to cut it. Until 2026-09-09 that hand-built package was the only one, so
# every Segler release shipped amd64 alone, and the arm64 half of the apt
# repository had nothing in it — while comma, whose loop this is, had been
# building both in CI all along.
#
# The checks are not skipped for a release. They are the reason the build is
# here rather than in a workflow of its own that would have to repeat them or
# do without.
#
# What it reaches and what it does not, stated because a green tick invites
# more faith than it has earned. The build needs no development packages:
# `ldd` on the binary names libc, libgcc and libm and nothing else, because
# everything a window needs is opened at run time rather than linked. Nothing
# headless reaches a window, so `packaging/linux/check-libraries.sh` and
# `CHECKLIST.md` stay commands run by a person with a display.
#
# The shape is slipcase-desktop's `linux.yml`, which is where each step's
# reasoning was first measured.
#
# Author: David M. Anderson
# Built with AI assistance (Claude, Anthropic)

name: linux

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Fires when a person publishes the release, which on this loop is what
  # happens: nothing else creates it. A release created by a workflow using
  # the default GITHUB_TOKEN fires no event at all — a GitHub safeguard with
  # no opt-out — so the dispatch below is the fallback for that case.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build packages for (e.g. v0.1.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    # Each architecture on a runner of that architecture rather than
    # cross-compiled, which is what lets every check below mean something
    # about the package it actually produced.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: What is installed
        run: rustc -V && cargo -V && python3 -V && dpkg-deb --version | head -1

      # `CLAUDE.md` forbids compiling C. `cargo tree -i cc` is not empty and
      # never will be, because `wayland-backend` declares `cc` and only uses
      # it under a feature nothing here turns on, so this checks the outcome
      # the rule means: no object file under any build directory, and nothing
      # linked at load time beyond libc.
      - name: Build, and nothing compiled C
        run: |
          cargo build --release --workspace
          target=$(cargo metadata --format-version 1 --no-deps |
              sed -n 's/.*"target_directory":"\([^"]*\)".*/\1/p')
          objects=$(find "${target}" -path '*/build/*' \( -name '*.o' -o -name '*.a' \) -print)
          [ -z "$objects" ] || { echo "a build script produced object files:"; echo "$objects"; exit 1; }

          echo "linked at load time:"
          ldd "${target}/release/segler-desktop" | sed 's/^/  /'
          strange=$(ldd "${target}/release/segler-desktop" |
              awk '{print $1}' | grep -vE '^(linux-vdso|libgcc_s|libm|libc|/lib64/ld-linux)' || true)
          [ -z "$strange" ] || { echo "unexpected shared libraries:"; echo "$strange"; exit 1; }

      - name: Build the package
        run: ./packaging/debian/build-deb.sh

      # Cheap, and the one thing that goes wrong silently when a package is
      # built somewhere other than where it was compiled: a package labelled
      # arm64 carrying an x86-64 executable installs perfectly and then does
      # not run.
      - name: The package is the architecture it claims
        run: |
          deb=$(ls dist/*.deb)
          test "$(dpkg-deb -f "$deb" Architecture)" = "${{ matrix.arch }}"

      # Everything `root/root` and nothing carrying a mode a package should not
      # ship; `md5sums` present, which is what `dpkg -V` reads; and every
      # recorded hash agreeing with the file it names.
      - name: The package holds up
        run: |
          deb=$(ls dist/*.deb)
          echo "checking ${deb}"

          strange=$(dpkg-deb --contents "$deb" | awk '$2 != "root/root"')
          [ -z "$strange" ] || { echo "not root/root:"; echo "$strange"; exit 1; }

          strange=$(dpkg-deb --contents "$deb" |
              awk '$1 !~ /^drwxr-xr-x/ && $1 !~ /^-rw-r--r--/ && $1 !~ /^-rwxr-xr-x/')
          [ -z "$strange" ] || { echo "unexpected modes:"; echo "$strange"; exit 1; }

          dpkg-deb --ctrl-tarfile "$deb" | tar t | grep -qx './md5sums' ||
              { echo "the package ships no md5sums" >&2; exit 1; }

          tree="${RUNNER_TEMP}/tree"
          dpkg-deb -x "$deb" "$tree"
          dpkg-deb -e "$deb" "${tree}/DEBIAN"
          ( cd "$tree" && md5sum -c DEBIAN/md5sums --quiet )

      # `error,warning`, and no overrides. The first local run produced three
      # tags about the copyright file, all because Apache-2.0 is a common
      # licence Debian wants referred to rather than copied; the package now
      # ships a DEP-5 copyright file and the tags are gone. `info` and
      # `pedantic` are Debian's suggestions rather than its rules.
      - name: What lintian says
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lintian
          lintian --info --tag-display-limit 0 --fail-on error,warning dist/*.deb

      # The only step that asks the platform anything. Through `gio` rather
      # than `xdg-mime`: with no desktop session `xdg-mime` falls back to
      # `file`, which reads magic and knows nothing of the shared-mime-info
      # database, and neither DocLang extension reserves magic. `gio` asks
      # GLib for the content type, which is the path a GTK file manager takes,
      # and needs no session.
      - name: The types and the handler are ours
        run: |
          sudo apt-get install -y -qq \
              shared-mime-info desktop-file-utils hicolor-icon-theme libglib2.0-bin

          # With the binaries, and with `~/.local/bin` on PATH for the
          # queries below. The first run installed the entry alone and GLib
          # named Chrome as the handler: `g_desktop_app_info_load_from_keyfile`
          # drops any entry whose `Exec` program it cannot find on PATH, so
          # the entry was invisible and the lookup fell through to the parent
          # type's default. An entry is only registered on a machine that can
          # run it, which is right, and is why `install.sh` says so when it
          # installs no executable.
          ./packaging/linux/install.sh
          export PATH="${HOME}/.local/bin:${PATH}"

          printf '%s\n' \
              '<?xml version="1.0" encoding="UTF-8"?>' \
              '<doclang xmlns="https://www.doclang.ai/ns/v0" version="0.7">' \
              '  <text>Hello world!</text>' \
              '</doclang>' > "${RUNNER_TEMP}/sample.dclg"
          ( cd "${RUNNER_TEMP}" && printf '' > document.xml && zip -q sample.dclx document.xml )

          for pair in "dclg application/vnd.doclang.document+xml" "dclx application/vnd.doclang.archive+zip"; do
              set -- $pair
              type=$(gio info -a standard::content-type "${RUNNER_TEMP}/sample.$1" |
                  sed -n 's/.*standard::content-type: //p')
              echo ".$1: ${type}"
              [ "$type" = "$2" ] || { echo "the type is not ours" >&2; exit 1; }

              handler=$(gio mime "$2" | sed -n 's/^Default application for .*: //p')
              echo "  default: ${handler}"
              [ "$handler" = "segler-desktop.desktop" ] ||
                  { echo "the handler is not ours; gio says:" >&2; gio mime "$2" >&2; exit 1; }
          done

          # What magic alone says, recorded rather than asserted. If either
          # ever stops being the generic answer the format has grown a
          # signature and the declaration can carry it.
          echo "magic alone: $(file --mime-type -b "${RUNNER_TEMP}/sample.dclx") / $(file --mime-type -b "${RUNNER_TEMP}/sample.dclg")"

      # Last, because it installs the package system-wide and the step above
      # asks GLib which handler is registered — an installed copy in
      # /usr/bin would change the question it is answering.
      #
      # `segler-desktop` cannot run here: nothing headless reaches a window,
      # which is what `CHECKLIST.md` is for. The CLI can, and until today
      # nothing had ever run either binary on arm64 — the package was built,
      # attached and installed by people without one execution behind it.
      - name: It installs, and what it installed runs
        run: |
          set -eux
          deb=$(ls dist/*.deb)
          sudo apt-get install -y "./${deb#./}"
          command -v segler
          segler --version

      - uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.arch }}
          path: dist/*.deb

  # Only on a release. A push builds the packages to check them and then
  # throws them away, which is the point of building them on a push.
  attach:
    needs: package
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true

      - name: Attach the packages to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          ls -l packages
          gh release upload \
            "${{ github.event.release.tag_name || inputs.tag }}" \
            packages/*.deb --clobber
