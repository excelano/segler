# Run the suite on Windows, check the things only a Windows machine can say,
# and assemble the Store package, attaching it to a published release. The
# checks themselves live in excelano/.github so every desktop-app repo in the
# fleet runs the same ones and a correction reaches all of them at once; what
# stays here is this product's own names, paths and screenshot recipe.
#
# Author: David M. Anderson
# Built with AI assistance (Claude, Anthropic)

name: windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The release event is what attaches the package. A person's token creates
  # the release, so the event fires.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      # Optional, because a screenshots run has no tag to give. With one the
      # package is attached to that release; without one it is built and kept
      # as an artefact.
      tag:
        description: 'Tag to package for (e.g. v0.1.4)'
        required: false
        type: string
      screenshots:
        description: 'Store screenshots'
        required: false
        default: 'no'
        type: choice
        options: ['no', 'reference', 'full']

permissions:
  contents: write

jobs:
  windows:
    uses: excelano/.github/.github/workflows/windows-desktop-ci.yml@main
    with:
      tag: ${{ inputs.tag }}
      binary-names: segler-desktop
      workspace: true
      gui-subsystem-check: true
      icon-check: true
      icon-check-paths: 'packaging/windows/segler.ico packaging/windows/dclx.ico packaging/windows/dclg.ico packaging/windows/assets packaging/windows/listing'
      install-check-associations: '[{"extension": ".dclx", "progId": "Excelano.Segler.Archive", "contentType": "application/vnd.doclang.archive+zip"}, {"extension": ".dclg", "progId": "Excelano.Segler.Document", "contentType": "application/vnd.doclang.document+xml"}]'
      install-check-owns-extension: 'true'
      screenshots: ${{ inputs.screenshots }}
      # The document is opened through the shell, so the association has to
      # exist: `install.ps1` puts the release binary behind `.dclx` the way it
      # does on a person's machine. The install check above runs `-NoBinary`
      # and takes its registration off again, so this is a second, real one.
      pre-screenshot-script: powershell -ExecutionPolicy Bypass -File packaging/windows/install.ps1
    secrets: inherit
