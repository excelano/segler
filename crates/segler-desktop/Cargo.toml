[package]
name = "segler-desktop"
description = "Edit DocLang documents as a reader sees them"
readme = "../../README.md"
keywords = ["doclang", "gui", "egui", "editor", "dclx"]
categories = ["gui", "text-processing"]
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "segler-desktop"
path = "src/main.rs"

[dependencies]
segler-core.workspace = true
# The language the window draws in, and the reader for the `.po` catalogues in
# `po/`. Written inside slipcase-desktop and made a crate on 2026-09-09 so that
# more than one application could have it. Pure Rust, no build script, and its
# two dependencies are platform-gated: the operating system's own answer to
# which language a person reads, which on macOS is the only answer available
# because a bundle opened from Finder has no environment at all.
potext = "0.1"
# Defaults carry accesskit, which stays on. Same framework as slipcase-desktop
# on purpose: one set of platform lessons for both applications.
eframe = "0.36"
# Defaults are `xdg-portal` and `wayland`, both pure Rust. The `gtk3` feature
# links C through gtk-sys and stays off.
rfd = "0.17"
# Decoding page images into textures. Each decoder is pure Rust: `png`,
# `zune-jpeg`, `image-webp`. The defaults would pull every format.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# A picture's `src` may be a data: URI with a base64 payload (spec §src).
base64 = "0.23"

[target.'cfg(target_os = "linux")'.dependencies]
# `winit` answers the system theme on Windows and macOS and returns `None` on
# Linux, so every Linux user would see the dark window whatever the desktop is
# set to. `src/system_theme.rs` asks the XDG portal instead; it is
# slipcase-desktop's module and the reasoning is there. zbus is pure Rust and
# already in the tree under `accesskit_unix`; `default-features` is off so
# `async-io` is named rather than taken.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Reading the window's icon out of the `.ico` the installer also registers.
# Windows takes a window icon from a resource compiled into the executable, and
# a resource compiler is exactly what DESIGN.md §5 keeps out of the build, so
# the icon is embedded as bytes and decoded at startup instead. Pure Rust; its
# `png` is for the large entries, which are stored that way. slipcase-desktop
# carries the same line for the same reason.
ico = "0.5"

[target.'cfg(target_os = "macos")'.dependencies]
# `src/opened_document.rs`, which receives the document Finder double-clicked:
# macOS delivers it as an Apple Event and never as an argument. All four are
# already in the tree on this target under `winit` and `rfd`, so nothing here
# adds a crate; features are named rather than taken. `objc2-app-kit` is for
# the one notification the handler is installed from, and `block2` is the
# block that observer is given.
block2 = "0.6"
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSData", "NSAppleEventManager", "NSAppleEventDescriptor", "NSNotification", "NSOperation", "block2", "objc2-core-services"] }
